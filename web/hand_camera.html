<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>손 인식 카메라</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; color: white; background: #12192a; }
    body { display: flex; flex-direction: column; border-radius: 20px; overflow: hidden; }
    .preview { position: relative; flex: 1; min-height: 0; }
    .translation { padding: 12px 16px; background: #1b2941; }
    .translation h2 { margin: 0 0 6px; font-size: 12px; color: #b5c9ee; }
    #translation { margin: 0; color: #42ebb6; font-size: 18px; font-weight: 600; min-height: 44px; overflow-wrap: anywhere; }
    video, canvas { position: absolute; width: 100%; height: 100%; object-fit: contain; }
    .front { transform: scaleX(-1); }
    #status { margin: 0; padding: 12px 16px; min-height: 44px; }
    .controls { display: flex; gap: 8px; padding: 0 12px 12px; }
    button { flex: 1; padding: 12px 6px; border: 0; border-radius: 10px; background: #dfe8ff; color: #183c88; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
  </style>
</head>
<body>
  <section class="translation" aria-label="수화 번역 결과">
    <h2>수화 번역</h2>
    <p id="translation" role="status" aria-live="polite">카메라 시작 후 동작을 보여 주세요</p>
  </section>
  <div class="preview">
    <video id="video" autoplay muted playsinline aria-label="실시간 카메라 영상"></video>
    <canvas id="overlay" aria-label="손 관절점"></canvas>
  </div>
  <p id="status" role="status">카메라 시작 버튼을 눌러 주세요.</p>
  <div class="controls">
    <button id="start">카메라 시작 / 재시도</button>
    <button id="flip" disabled>카메라 전환</button>
  </div>
  <script type="module" src="hand_camera.js"></script>
</body>
</html>
