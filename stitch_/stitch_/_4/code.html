<style>
        .spinner {
            animation: spin 1.5s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .pulse {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0; }
            100% { transform: scale(0.8); opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-primary-container h-full w-full flex items-center justify-center font-body-md text-on-primary">
<!-- Main Container Fixed Size -->
<main class="w-[390px] h-[884px] bg-primary-container relative flex flex-col items-center justify-center overflow-hidden">
<!-- TopAppBar: Hiding Nav Shell for Transactional Context as per rules, but showing TopAppBar for context if required by layout, but the rules state "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional... Success/Confirmation". This is a "loading" / "executing" screen, thus transactional. Suppressing Nav shell completely except user asked for BottomNavBar explicitly: "Footer: Include the standard BottomNavBar with 'Settings' (or current active tab) highlighted in blue."  Will provide BottomNavBar as requested, TopAppBar hidden for cleaner canvas. -->
<!-- Background subtle effects -->
<div class="absolute inset-0 z-0 flex items-center justify-center opacity-20">
<div class="w-64 h-64 rounded-full border-4 border-on-primary pulse"></div>
<div class="w-96 h-96 rounded-full border-4 border-on-primary absolute pulse" style="animation-delay: 0.5s"></div>
</div>
<!-- Center Content (Loading) -->
<div class="z-10 flex flex-col items-center justify-center w-full px-gutter mt-[-100px]">
<!-- Spinner -->
<div class="relative w-24 h-24 mb-stack-md flex items-center justify-center">
<svg class="spinner w-full h-full text-on-primary" fill="none" viewBox="0 0 24 24">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
<!-- Central Icon indicating execution -->
<span class="material-symbols-outlined absolute text-primary-container bg-on-primary rounded-full p-2" style="font-size: 24px;">bolt</span>
</div>
<!-- Text -->
<h1 class="font-headline-md text-headline-md text-on-primary mb-stack-sm text-center tracking-tight">명령 실행 중...</h1>
<p class="font-body-md text-body-md text-on-primary-container text-center max-w-[80%]">SignBridge is processing your request</p>
</div>
<!-- Bottom Command Card -->
<div class="absolute bottom-32 w-full px-gutter z-10 pb-safe">
<div class="bg-surface-container-lowest rounded-xl shadow-lg p-margin-mobile flex items-center gap-gutter border border-surface-container">
<div class="w-12 h-12 rounded-full bg-error-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-error-container" style="font-variation-settings: 'FILL' 1;">call_end</span>
</div>
<div class="flex-1">
<p class="font-caption text-caption text-on-surface-variant mb-1 uppercase tracking-wider">Executing Command</p>
<p class="font-body-lg text-body-lg text-on-surface font-semibold">"전화 끊어줘"</p>
</div>
</div>
</div>
<!-- BottomNavBar (Requested by user despite it being a loading screen) -->
<nav class="BottomNavBar fixed bottom-0 left-0 w-full z-50 rounded-t-xl bg-surface-container dark:bg-surface-container-lowest shadow-lg flex justify-around items-center h-20 px-base pb-safe max-w-[390px] left-1/2 -translate-x-1/2">
<!-- Translation - Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-spacing-gutter py-1 hover:bg-surface-variant transition-all active:scale-90 duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1">interpreter_mode</span>
<span class="font-label-caps text-label-caps text-[10px]">Translation</span>
</a>
<!-- Devices - Active (Since it's a device command context, Devices seems most appropriate active tab instead of settings, though prompt said settings or current active. Command context = Devices) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-spacing-gutter py-1 hover:bg-surface-variant transition-all active:scale-90 duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1">stream_apps</span>
<span class="font-label-caps text-label-caps text-[10px]">Devices</span>
</a>
<!-- History - Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-spacing-gutter py-1 hover:bg-surface-variant transition-all active:scale-90 duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1">history</span>
<span class="font-label-caps text-label-caps text-[10px]">History</span>
</a>
<!-- Settings - Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-spacing-gutter py-1 hover:bg-surface-variant transition-all active:scale-90 duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1">settings</span>
<span class="font-label-caps text-label-caps text-[10px]">Settings</span>
</a>
