<script>
        // Simple script to handle button interaction for demo purposes
        document.querySelector('.bg-primary').addEventListener('click', function() {
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 150);
        });
    </script>
